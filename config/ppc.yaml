# Number of samples to generate
num_samples: 512

# Data paths
conditional_output_path: "/gpfs/home/acad/ulg-sysmod/tsavary/DataAssimilation/GenCast/data/PPC/all_variables/"
unconditional_output_path: "/gpfs/home/acad/ulg-sysmod/tsavary/DataAssimilation/GenCast/data/PPC/unconditional/"
data_path: "/gpfs/home/acad/ulg-sysmod/tsavary/DataAssimilation/GenCast/data/trajectories/2019_03_29_1.0_13_30.nc"

# Checkpoint path
checkpoint_path: "/gpfs/home/acad/ulg-sysmod/tsavary/DataAssimilation/GenCast/checkpoints/gencast_1deg.npz"

# Stats path
min_x_path: "/gpfs/home/acad/ulg-sysmod/tsavary/DataAssimilation/GenCast/data/stats/min_x.nc"
std_x_path: "/gpfs/home/acad/ulg-sysmod/tsavary/DataAssimilation/GenCast/data/stats/std_x.nc"
std_z_path: "/gpfs/home/acad/ulg-sysmod/tsavary/DataAssimilation/GenCast/data/stats/std_z.nc"
mean_x_path: "/gpfs/home/acad/ulg-sysmod/tsavary/DataAssimilation/GenCast/data/stats/mean_x.nc"

# Sampler
sampler: "abs"
sampler_config:
  max_noise_level: 88.0
  min_noise_level: 1e-5
  num_noise_levels: 32
  rho: 6.0
  order: 3
  correction: True
  num_correction_steps: 2
  delta: 0.25

# Mask (observations)
mask_sat_path: "/gpfs/home/acad/ulg-sysmod/tsavary/DataAssimilation/GenCast/data/observations/mask/mask_sat_1.npy"
mask_ws_path: "/gpfs/home/acad/ulg-sysmod/tsavary/DataAssimilation/GenCast/data/observations/mask/mask_ws_1.npy"

# Observed variables (observations)
observed_variables_sat: ["temperature"]
observed_variables_ws: [
    "10m_u_component_of_wind",
    "10m_v_component_of_wind",
    "2m_temperature",
    "mean_sea_level_pressure",
    "sea_surface_temperature",
]

# Covariance matrix of unnormalized observations
sigma_y_sat_path: "/gpfs/home/acad/ulg-sysmod/tsavary/DataAssimilation/GenCast/data/observations/covariance/satellite.npy"
sigma_y_ws_path: "/gpfs/home/acad/ulg-sysmod/tsavary/DataAssimilation/GenCast/data/observations/covariance/weather_stations.npy"

# MMPS Solver
solver: "bicgstab"
max_iter: 3
tol: 1e-10