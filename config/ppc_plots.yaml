    - ["geopotential", 50]
    - ["geopotential", 250]
    - ["geopotential", 600]
    - ["geopotential", 1000]

# Standard deviations
stds:
    geopotential:
        50: !!float 100
        250: !!float 100
        600: !!float 100
        1000: !!float 100


# (Latitude, Longitude)
lat: !!int 62
lon: !!int 25

# Mask (observations)
mask_sat_path: !!str "/gpfs/home/acad/ulg-sysmod/tsavary/DataAssimilation/GenCast/data/observations/mask/mask_sat_1.npy"
mask_ws_path: !!str "/gpfs/home/acad/ulg-sysmod/tsavary/DataAssimilation/GenCast/data/observations/mask/mask_ws_1.npy"

# Labels
xlabels:
    - 'Level: 50 hPA'
    - 'Level: 250 hPA'
    - 'Level: 600 hPA'
    - 'Level: 1000 hPA'

# Colors
